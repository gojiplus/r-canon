version: 2
updates:
  # The three reusable workflows in this repo are pinned by every package in
  # the R fleet as @v1, so the action versions they reference are the fleet's
  # single point of update -- and its single point of failure. A stale major
  # here breaks CI everywhere at once, and nothing else was watching them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain guard: only propose releases at least a week old.
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
