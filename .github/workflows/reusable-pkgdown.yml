# The fleet's pkgdown build and deploy.
#
# Builds on every push and pull request so a broken site is caught in review,
# but only deploys from the default branch and from tags. Deploying from a pull
# request would publish an unreviewed site.

name: reusable-pkgdown

on:
  workflow_call:
    inputs:
      extra-packages:
        description: Additional packages to install, in the r-lib/actions format.
        required: false
        type: string
        default: "any::pkgdown, local::."

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Two deploys racing each other can publish the older build last. Pull
    # requests never deploy, so give each its own group rather than serialising
    # them behind the branch builds.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    # Pushing to gh-pages needs write. A called workflow cannot grant itself
    # more than the caller has, and these repos default to a read-only token,
    # so the CALLER must also declare `permissions: contents: write` on the job
    # that calls this. Without it the run fails at startup with no log. See
    # STANDARD.md for the shim.
    permissions:
      contents: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: ${{ inputs.extra-packages }}
          needs: website

      - name: Build site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)

      - name: Deploy to gh-pages
        # Only from the default branch or a tag. Pull requests build but do not
        # publish.
        if: >
          github.event_name != 'pull_request' &&
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
           startsWith(github.ref, 'refs/tags/'))
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
